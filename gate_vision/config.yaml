name: "Gate Vision"
version: "1.1.3"
slug: "gate_vision"
description: "Camera-verified main gate controller"
url: "https://github.com/adambrest/home-assistant-gate-vision/tree/main/gate_vision"
arch:
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8080
panel_title: Gate Vision
panel_icon: mdi:boom-gate
services:
  - mqtt:need
image: "ghcr.io/adambrest/gate-vision"
options:
  camera_entity: "camera.garage_high_resolution_channel"
  gate_script: "script.main_gate_relay_pulse"
  moving_poll_hold_seconds: 2
  confirmation_window: 4
  confirmation_required: 3
  gate_travel_timeout_seconds: 35
  partial_stall_seconds: 10
  wrong_endpoint_seconds: 5
  max_gate_attempts: 3
schema:
  camera_entity: str
  gate_script: str
  moving_poll_hold_seconds: float
  confirmation_window: int
  confirmation_required: int
  gate_travel_timeout_seconds: float
  partial_stall_seconds: float
  wrong_endpoint_seconds: float
  max_gate_attempts: int
