name: "Vision Gate Controller"
version: "1.1.8"
slug: "gate_vision"
description: "Camera-verified main gate controller"
url: "https://github.com/adambrest/vision-gate-controller/tree/main/gate_vision"
arch:
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8080
panel_title: Vision Gate Controller
services:
  - mqtt:need
image: "ghcr.io/adambrest/vision-gate-controller"
options:
  camera_entity: "camera.garage_high_resolution_channel"
  gate_script: "script.main_gate_relay_pulse"
  moving_poll_hold_seconds: 2
  confirmation_window: 4
  confirmation_required: 3
  gate_travel_timeout_seconds: 35
  partial_stall_seconds: 10
  wrong_endpoint_seconds: 5
  max_gate_attempts: 3
  camera_unavailable_after_seconds: 15
  endpoint_travel_tolerance: 0.08
schema:
  camera_entity: str
  gate_script: str
  moving_poll_hold_seconds: float
  confirmation_window: int
  confirmation_required: int
  gate_travel_timeout_seconds: float
  partial_stall_seconds: float
  wrong_endpoint_seconds: float
  max_gate_attempts: int
  camera_unavailable_after_seconds: float
  endpoint_travel_tolerance: float
