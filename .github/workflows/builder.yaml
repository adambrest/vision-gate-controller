name: Builder

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    name: Build Vision Gate Controller
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      app: gate_vision
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
